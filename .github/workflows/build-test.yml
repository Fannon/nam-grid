name: Build and test
on:
  workflow_call:
    inputs:
      source-ref:
        description: Commit or tag to build
        required: false
        type: string
        default: ''
  workflow_dispatch:
  # Hosted minutes are billed (Linux x1, Windows x2, macOS x10 on private repositories). Pull
  # requests are the merge gate, so main is not rebuilt after merging, and
  # Other documentation-only changes build the VitePress site in Docs instead.
  # Module tables also need the compiled range/default consistency check.
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!LICENSE'
      - '!.github/workflows/deploy-docs.yml'
      - '!.github/workflows/docs-check.yml'
      - 'docs/modules/**'
permissions:
  contents: read
# A new push to a pull request supersedes its running build.
concurrency:
  group: build-test-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.source-ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    strategy:
      fail-fast: false
      # Pull requests build Windows only. macOS and Linux run weekly (Build Native),
      # for releases and on manual runs. Linux builds on the oldest supported glibc.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os":"windows-2022","platform":"windows-x64"}]'
          || '[{"os":"windows-2022","platform":"windows-x64"},{"os":"macos-15","platform":"macos-arm64"},{"os":"ubuntu-22.04","platform":"linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # A hung editor test must not consume the monthly budget.
    env:
      # Compiled objects are cached by content, so unchanged dependencies
      # (iPlug2, NAM Core, Eigen, SDKs) are not recompiled on every run.
      SCCACHE_GHA_ENABLED: 'true'
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_OBJC_COMPILER_LAUNCHER: sccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Fetch pinned submodules
        # GitLab can reject Eigen clones under load. The mirror serves the same
        # pinned Git objects, including Eigen nested inside the NAM dependencies.
        # Scope the rewrite to this command; do not change submodules or Git config.
        run: >-
          git -c "url.https://github.com/eigen-mirror/eigen.insteadOf=https://gitlab.com/libeigen/eigen"
          submodule update --init --recursive --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y g++-12 ninja-build pkg-config
          libfreetype-dev libfontconfig-dev libx11-dev libxi-dev libxext-dev libxrender-dev
          libxrandr-dev libxfixes-dev libxcursor-dev libxinerama-dev libxtst-dev libgl-dev
          libgtk-3-dev libasound2-dev libjack-jackd2-dev libpulse-dev xvfb libgl1-mesa-dri
      - run: python scripts/setup-deps.py
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Visual Studio generators ignore compiler launchers; Ninja with the MSVC
      # environment lets sccache wrap cl.exe.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
        if: runner.os == 'Windows'
      - run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
        if: runner.os == 'macOS'
      - run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
        if: runner.os == 'Linux'
        env:
          CC: gcc-12
          CXX: g++-12
      - run: cmake --build build/ci --config Release --target nam-grid-clap nam-grid-vst3 nam-stage-tests nam-aliasing-tests nam-clap-smoke nam-tuner-tests nam-parameter-contract nam-library-tests nam-wav-tests nam-resampling-tests nam-ir-tests --parallel 3
      - name: Python tool tests
        run: python -m unittest discover -s tests -p "test_*.py"
      # Hosted Windows runners only expose the GDI OpenGL 1.1 renderer, which the
      # NanoVG editor cannot use (created contexts are unusable and the GUI tests
      # crash). Supply Mesa's llvmpipe so the editor tests run on a real GL 4.x.
      - name: Cache software OpenGL
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mesa
          key: mesa-llvmpipe-26.2.4
      - name: Install software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          if (-not (Test-Path (Join-Path $mesa 'x64\opengl32.dll'))) {
            $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
            Invoke-WebRequest -OutFile $archive "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z"
            & 7z x $archive "-o$mesa" -y | Out-Null
          }
          # App-local DLLs are resolved from the executable's directory only, so
          # place the renderer next to every test binary (the GUI runs there).
          Get-ChildItem -Recurse build/ci -Filter *.exe | ForEach-Object {
            Copy-Item "$mesa\x64\*.dll" $_.DirectoryName -Force
          }
      - name: Compiler cache statistics
        run: sccache --show-stats
      - run: ctest --test-dir build/ci -C Release --output-on-failure
        if: runner.os != 'Linux'
        env:
          GALLIUM_DRIVER: llvmpipe
      # The Linux editor checks need an X server; Xvfb renders through Mesa llvmpipe.
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build/ci -C Release --output-on-failure
        if: runner.os == 'Linux'
      # Zip before artifact upload: GitHub artifacts otherwise discard the
      # executable permissions required by macOS plugin bundles.
      - name: Archive plugins and notices
        run: python scripts/package-release.py --build-dir build/ci --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: nam-grid-${{ matrix.platform }}
          path: build/ci/nam-grid-${{ matrix.platform }}.zip
          if-no-files-found: error
          # Artifact storage is also billed; releases download them immediately.
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
