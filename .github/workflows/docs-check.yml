name: Build docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/test_docs_anchors.py'
      - '**.md'
      - '.github/workflows/deploy-docs.yml'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Docs-only changes skip the build workflow, so check the page links here.
      - name: Check Markdown heading anchors
        run: python -m unittest discover -s tests -p "test_docs_anchors.py"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm --prefix docs run docs:build
