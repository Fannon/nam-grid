name: nam-grid
on:
  workflow_call:
    inputs:
      source-ref:
        description: Commit or tag to build
        required: false
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/setup-deps.py
      - run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-ci --config Release --target nam-grid-clap nam-grid-vst3 nam-stage-tests nam-clap-smoke nam-library-tests nam-wav-tests nam-resampling-tests --parallel 3
      - run: ctest --test-dir build-ci -C Release --output-on-failure
      # Zip before artifact upload: GitHub artifacts otherwise discard the
      # executable permissions required by macOS plugin bundles.
      - name: Archive plugins and notices
        shell: python
        run: |
          import shutil
          from pathlib import Path

          output = Path("build-ci/out")
          for name in ("nam-grid.clap", "nam-grid.vst3", "ThirdPartyNotices.txt", "notices"):
              if not (output / name).exists():
                  raise SystemExit(f"Missing release output: {name}")
          shutil.make_archive("build-ci/nam-grid-${{ matrix.platform }}", "zip", output)
      - uses: actions/upload-artifact@v4
        with:
          name: nam-grid-${{ matrix.platform }}
          path: build-ci/nam-grid-${{ matrix.platform }}.zip
          if-no-files-found: error
