name: Release Native

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/dual-prototype.yml

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/nam-grid-*/*.zip --verify-tag --draft --title "nam-grid $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
