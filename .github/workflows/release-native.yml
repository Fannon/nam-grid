name: Release Native

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.1.0)
        required: true
        type: string
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-native-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Expected a valid version tag beginning with v"
            exit 1
          fi
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          # Every version representation in the tagged source must match the tag.
          COMMIT="$commit" python3 - <<'EOF'
          import os, re, subprocess, sys
          tag, commit = os.environ["RELEASE_TAG"], os.environ["COMMIT"]
          show = lambda path: subprocess.check_output(["git", "show", f"{commit}:{path}"], text=True)
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if not match:
              sys.exit(f"::error::Release tags must look like v1.2.3, not {tag}")
          major, minor, patch = map(int, match.groups())
          version = f"{major}.{minor}.{patch}"
          config = show("NeuralAmpModeler/config.h")
          found = {name: re.search(rf"^#define {name} (\S+)", config, re.M).group(1)
                   for name in ("PLUG_VERSION_STR", "PLUG_VERSION_HEX", "PLUG_VERSION_RC")}
          expected = {"PLUG_VERSION_STR": f'"{version}"', "PLUG_VERSION_HEX": f"0x{major:04X}{minor:02X}{patch:02X}",
                      "PLUG_VERSION_RC": f"{major},{minor},{patch},0"}
          errors = [f"config.h {k}={found[k]}, expected {v}" for k, v in expected.items() if found[k].upper() != v.upper()]
          for plist in ("nam-grid-CLAP-Info.plist", "nam-grid-VST3-Info.plist"):
              versions = set(re.findall(r"<key>CFBundle(?:Short)?(?:Version|VersionString)</key><string>([^<]*)</string>",
                                    show(f"NeuralAmpModeler/resources/{plist}")))
              if versions != {version}:
                  errors.append(f"{plist} versions {sorted(versions)}, expected {version}")
          if errors:
              sys.exit("::error::Tag/version mismatch: " + "; ".join(errors))
          EOF
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build-test:
    needs: prepare
    uses: ./.github/workflows/build-test.yml
    with:
      source-ref: ${{ needs.prepare.outputs.commit }}

  release:
    needs: [prepare, build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: nam-grid-*
          path: artifacts
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows-x64 macos-arm64; do
            test -s "artifacts/nam-grid-$platform.zip"
          done
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/nam-grid-*.zip --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/nam-grid-*.zip \
              --verify-tag --draft --title "nam-grid $RELEASE_TAG" \
              --notes-file docs/release-notes.md
          fi
